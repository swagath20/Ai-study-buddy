<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: auto;">
            <a href="{{ url_for('index') }}" class="logo">⚡ AI Study Buddy</a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" style="color: var(--text-primary); text-decoration: none; margin-right: 1.5rem;">New Note</a>
                <a href="{{ url_for('history') }}" style="color: var(--text-secondary); text-decoration: none;">History</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
